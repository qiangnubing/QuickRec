[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quickrec"
version = "1.4.1"
description = "QuickRec — Windows screen region recorder with 60s/MAX presets, bilingual UI, quality control, and system/microphone audio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "LYU TONG", email = "1098220238@qq.com" },
]
keywords = [
    "screen-recorder",
    "screen-capture",
    "windows",
    "wasapi",
    "ffmpeg",
    "tkinter",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "mss>=10.0",
    "numpy>=1.26",
    "soundcard>=0.4.6",
    "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
quickrec = "short_video_capture.__main__:main"
screen-recorder = "short_video_capture.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
short_video_capture = ["assets/*.ico", "assets/*.png"]
