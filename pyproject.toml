[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quickrec"
version = "1.3.0"
description = "QuickRec — Windows 屏幕区域录制工具，支持 60 秒/MAX、中英文界面、画质与系统音频"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mss>=10.0",
    "numpy>=1.26",
    "soundcard>=0.4.6",
    "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
quickrec = "short_video_capture.__main__:main"
screen-recorder = "short_video_capture.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
short_video_capture = ["assets/*.ico", "assets/*.png"]
